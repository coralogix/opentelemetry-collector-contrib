# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Fix top_query delta spikes after collector restart or cache eviction and zero-blackout or undercount after pg_stat_statements_reset.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: []

# (Optional) One or more lines of additional information to render under the main note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Unseen or evicted statements are now seeded (reported as 0) instead of reporting their lifetime totals; seeds and evictions are counted by the new `postgresql.top_query.cache.seeded` and `postgresql.top_query.cache.evicted` internal telemetry metrics.
  Resets are detected from `pg_stat_statements_info.stats_reset` on PostgreSQL 14+ and from decreasing counters otherwise.
  On PostgreSQL 14+ with `pg_stat_statements.track = 'all'`, top-level and nested entries of a statement no longer reset each other; they are reported as one record with summed deltas.

# If your change doesn't affect end users or the exported elements of any package,
# you should mark this change as internal. Optional value: ['user', 'api']
change_logs: [user]
