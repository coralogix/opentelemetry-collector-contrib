$defs:
  connection_pool:
    type: object
    properties:
      max_idle:
        x-pointer: true
        type: integer
      max_idle_time:
        x-pointer: true
        type: string
        format: duration
      max_lifetime:
        x-pointer: true
        type: string
        format: duration
      max_open:
        x-pointer: true
        type: integer
  dbm_config:
    description: DBMConfig holds Coralogix Database Monitoring (DBM) options.
    type: object
    properties:
      allow_literal_capture:
        description: 'AllowLiteralCapture adds the un-obfuscated statement text to each db.server.query_sample record as db.query.text.raw. Default false. The receiver applies no redaction to it: the DBM edge processor (dbmprocessor) runs the credential rule and deletes the attribute unless a Full capture lease applies, so it must run in every pipeline that receives these records.'
        type: boolean
  query_sample_collection:
    type: object
    properties:
      max_rows_per_query:
        type: integer
        x-customType: int64
  top_query_candidate_order:
    description: TopQueryCandidateOrder is the pg_stat_statements order of the top_query candidates.
    type: string
  top_query_collection:
    type: object
    properties:
      candidate_order:
        description: 'CandidateOrder selects which max_rows_per_query statements are fetched from pg_stat_statements: "calls" (default) takes the most executed ones, "total_time" the ones with the most total execution time, so a rare slow statement is not missed.'
        $ref: top_query_candidate_order
      collection_interval:
        type: string
        format: duration
      max_explain_each_interval:
        type: integer
        x-customType: int64
      max_rows_per_query:
        type: integer
        x-customType: int64
      query_plan_cache_size:
        type: integer
      query_plan_cache_ttl:
        type: string
        format: duration
      temporality:
        description: 'Temporality selects how db.server.top_query reports statement counters: "delta" (default) reports per-interval deltas computed in the receiver; "cumulative" reports the raw pg_stat_statements counters of every fetched statement with postgresql.start_time and postgresql.toplevel, so a downstream consumer computes the deltas.'
        $ref: top_query_temporality
      top_n_query:
        type: integer
        x-customType: int64
  top_query_temporality:
    description: TopQueryTemporality is the aggregation temporality of top_query counters.
    type: string
type: object
properties:
  connect_database:
    description: ConnectDatabase is the connection target for cluster-wide queries. Defaults to "postgres" (see createDefaultConfig). Independent of Databases (the reporting scope).
    type: string
  connection_pool:
    $ref: connection_pool
  databases:
    type: array
    items:
      type: string
  db_auth:
    description: DBAuth optionally sources the connection credential from a db_auth provider extension (e.g. AWS IAM) instead of a static password. When set, the provider supplies the password at connection-open time. Mutually exclusive with the top-level password field.
    $ref: /config/configdbauth.id
  dbm:
    description: DBM holds Coralogix Database Monitoring options.
    $ref: dbm_config
  exclude_databases:
    type: array
    items:
      type: string
  password:
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  query_sample_collection:
    $ref: query_sample_collection
  tls:
    $ref: go.opentelemetry.io/collector/config/configtls.client_config
  top_query_collection:
    $ref: top_query_collection
  username:
    type: string
allOf:
  - $ref: go.opentelemetry.io/collector/scraper/scraperhelper.controller_config
  - $ref: go.opentelemetry.io/collector/config/confignet.addr_config
  - $ref: ./internal/metadata.metrics_builder_config
  - $ref: ./internal/metadata.logs_builder_config
